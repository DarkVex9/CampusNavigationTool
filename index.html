<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TXST Navigation</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body style="user-select:none;">
	<div id="mapImgContainer">
		<img id="mainMapImg" src="map_images/outside.png" class="fixed_position" style="z-index:-2; object-fit:cover;transform-origin: 0% 0%;">
	</div>
	<canvas id="overlay" class="fixed_position" style="z-index:-1;"></canvas>
	
	<span id="routePanel" class="ui_panel">
		<table>
			<tr>
				<td>
					<p>TXST Campus Navigation</p>
				</td>
			</tr>
			<tr>
				<td>
					<label for="origin" align="right">From:</label>
				</td>
				<td>
					<input type="text" id="origin">
				</td>
			</tr>
			<tr>
				<td>
					<label for="destination" align="right">To:</label>
				</td>
				<td>
					<input type="text" id="destination">
				</td>
			</tr>
		</table>
		<button id="go_button">Go</button>
		
		<!-- Accessibility options -->
		<div class="accessibility-options">
			<div class="option">
				<input type="checkbox" id="avoidStairs" name="avoidStairs">
				<label for="avoidStairs">Stairs</label>
			</div>
			<div class="option">
				<input type="checkbox" id="avoidElevators" name="avoidElevators">
				<label for="avoidElevators">Elevator</label>
			</div>
		</div>
	</span>
	<br>
	<span id="editorTools" style="display:none;">
		<select id="layerSelect">
		</select>
		<br>
		<span style="pointer-events: none;">
			<p id="editorMode">Editor Mode: None</p>
			<b>== Editor Modes ==</b>
			<p>[A] Add</p>
			<p>[M] Move</p>
			<p>[E] Edit</p>
			<p>[C] Connect</p>
			<p>[Esc] None</p>
			<b>== Other Hotkeys ==</b>
			<p>[D] Toggle drawing nodes</p>
			<p>[P] Print layer to console</p>
			<p>[Backspace] Delete selected node</p>
			<p>[Delete] Delete selected node</p>
		</span>
	</span>
	
	<!-- Node metadata panel -->
	<span id="nodePanel" class="ui_panel" style="display:none; position:absolute; top:0px; right:0px">
		<p>Node Metadata</p>
		<hr>
		<label for="nodeName">Room Name</label>
		<input type="text" id="nodeName">
		<hr>
		<p>Flags:</p>
		<input type="checkbox" id="isStairs">
		<label for="isStairs">Stairs</label>
		<br>
		<input type="checkbox" id="isElevator">
		<label for="isElevator">Elevator</label>
		<hr>
		<p>Connections:</p>
		<div id="nodeConnections">
		</div>
		<hr>
		<button id="addLayerChangeConnection">Add Layer Change Connection</button>
	</span>

	<!-- Load modular JavaScript files -->
	<script src="js/utils.js"></script>
	<script src="js/data.js"></script>
	<script src="js/pathfinding.js"></script>
	<script src="js/ui.js"></script>
	<script src="js/editor.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
